services:
  - type: web
    name: bale-truth-dare-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: bale-bot-database
          property: connectionString

databases:
  - name: bale-bot-database
    databaseName: bale_bot
    user: bale_user
