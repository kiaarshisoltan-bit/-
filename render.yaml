services:
  - type: web
    name: bale-truth-dare-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/bot.db
    disk:
      name: bale-bot-data
      mountPath: /var/data
      sizeGB: 1
